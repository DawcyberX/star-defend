<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Star Defender FIXED</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; margin:auto; background:#000; }
</style>
</head>
<body>

<canvas id="c" width="800" height="600"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

// GAME STATE
let keys={};
let bullets=[];
let enemies=[];
let score=0;

// PLAYER (ONLY ONE — NEVER RECREATED)
const player={
  x:380,y:520,w:40,h:40,speed:6,
  cooldown:0
};

// INPUT
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

// ENEMIES SPAWN (SAFE SINGLE LOOP)
setInterval(()=>{
  enemies.push({
    x:Math.random()*760,
    y:-20,
    w:30,
    h:30,
    speed:2+Math.random()*2
  });
},800);

// SHOOT (FIXED: no spam duplication)
function shoot(){
  const now=Date.now();
  if(now - player.cooldown < 200) return;
  player.cooldown = now;

  bullets.push({
    x:player.x+18,
    y:player.y,
    w:4,
    h:10
  });
}

// COLLISION (FIXED)
function hit(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

// UPDATE
function update(){

  // MOVE PLAYER
  if(keys["ArrowLeft"]) player.x-=player.speed;
  if(keys["ArrowRight"]) player.x+=player.speed;
  if(keys["ArrowUp"]) player.y-=player.speed;
  if(keys["ArrowDown"]) player.y+=player.speed;

  // SHOOT
  if(keys[" "]) shoot();

  // BULLETS MOVE
  bullets.forEach(b=>b.y-=10);

  // ENEMIES MOVE
  enemies.forEach(e=>e.y+=e.speed);

  // REMOVE OFFSCREEN
  bullets = bullets.filter(b=>b.y>-20);
  enemies = enemies.filter(e=>e.y<650);

  // BULLET HIT ENEMY (SAFE LOOP FIX)
  for(let i=bullets.length-1;i>=0;i--){
    for(let j=enemies.length-1;j>=0;j--){
      if(hit(bullets[i],enemies[j])){
        bullets.splice(i,1);
        enemies.splice(j,1);
        score+=10;
        break;
      }
    }
  }

  // PLAYER HIT ENEMY
  for(let i=enemies.length-1;i>=0;i--){
    if(hit(player,enemies[i])){
      enemies.splice(i,1);
      score-=5;
    }
  }
}

// DRAW
function draw(){
  ctx.clearRect(0,0,800,600);

  // player
  ctx.fillStyle="cyan";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // bullets
  ctx.fillStyle="yellow";
  bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  // enemies
  ctx.fillStyle="red";
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));

  // score
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,10,20);
}

// LOOP (ONLY ONCE)
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
