<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Star Defender Final Boss</title>
<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }
canvas { display:block; margin:auto; background:radial-gradient(#050520,#000); }
</style>
</head>
<body>

<canvas id="game" width="800" height="600"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

// ================= STATE =================
let keys={}, bullets=[], enemies=[], particles=[], powerups=[];
let score=0, lives=3, shield=0;
let boss=null;

// ================= PLAYER =================
const player={x:380,y:520,w:40,h:40,speed:6};

// ================= INPUT =================
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

// ================= AUDIO (dynamic intensity) =================
let audioCtx;
function sound(freq){
  try{
    if(!audioCtx) audioCtx=new AudioContext();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=freq;
    g.gain.value=0.05;
    o.start();
    setTimeout(()=>o.stop(),60);
  }catch(e){}
}

// ================= EXPLOSION =================
function boom(x,y,color="orange"){
  for(let i=0;i<20;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*6,
      life:30,
      color
    });
  }
}

// ================= HIT =================
function hit(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

// ================= STARFIELD =================
let stars=[...Array(120)].map(()=>({
  x:Math.random()*800,
  y:Math.random()*600,
  s:Math.random()*2
}));

// ================= ENEMIES =================
setInterval(()=>{
  if(!boss){
    enemies.push({
      x:Math.random()*760,
      y:-20,
      w:30,
      h:30,
      speed:2+Math.random()*3
    });
  }
},600);

// ================= POWERUPS =================
setInterval(()=>{
  powerups.push({
    x:Math.random()*760,
    y:-20,
    w:20,
    h:20,
    type:Math.random()<0.5?"rapid":"shield",
    speed:2
  });
},5000);

// ================= BOSS =================
function spawnBoss(){
  boss={
    x:250,y:80,w:300,h:100,
    hp:120,
    maxHp:120,
    phase:1,
    dir:3,
    cooldown:0
  };
  enemies=[];
}

// ================= SHOOT =================
function shoot(){
  bullets.push({x:player.x+18,y:player.y,w:4,h:10});
  sound(600+score%200);
}

// ================= UPDATE =================
function update(){

  // movement
  if(keys["ArrowLeft"]) player.x-=player.speed;
  if(keys["ArrowRight"]) player.x+=player.speed;
  if(keys["ArrowUp"]) player.y-=player.speed;
  if(keys["ArrowDown"]) player.y+=player.speed;

  // shooting
  if(keys[" "] && (!player.cd || Date.now()-player.cd>180)){
    shoot();
    player.cd=Date.now();
  }

  bullets.forEach(b=>b.y-=10);
  enemies.forEach(e=>e.y+=e.speed);
  powerups.forEach(p=>p.y+=p.speed);

  bullets=bullets.filter(b=>b.y>-20);
  enemies=enemies.filter(e=>e.y<650);
  powerups=powerups.filter(p=>p.y<650);

  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  });
  particles=particles.filter(p=>p.life>0);

  // bullet hits enemy
  bullets.forEach((b,bi)=>{
    enemies.forEach((e,ei)=>{
      if(hit(b,e)){
        boom(e.x,e.y,"red");
        bullets.splice(bi,1);
        enemies.splice(ei,1);
        score+=10;
      }
    });
  });

  // player hits enemy
  enemies.forEach((e,ei)=>{
    if(hit(player,e)){
      if(shield>0){
        shield--;
      }else{
        lives--;
      }
      boom(player.x,player.y,"cyan");
      enemies.splice(ei,1);
      if(lives<=0) gameOver();
    }
  });

  // powerups
  powerups.forEach((p,pi)=>{
    if(hit(player,p)){
      if(p.type==="rapid"){
        player.speed=9;
        setTimeout(()=>player.speed=6,4000);
      }
      if(p.type==="shield"){
        shield+=2;
      }
      boom(p.x,p.y,"yellow");
      powerups.splice(pi,1);
      sound(900);
    }
  });

  // boss spawn
  if(score>=300 && !boss){
    spawnBoss();
  }

  // boss logic
  if(boss){

    // phase system
    if(boss.hp < boss.maxHp*0.6) boss.phase=2;
    if(boss.hp < boss.maxHp*0.3) boss.phase=3;

    // movement patterns
    boss.x += boss.dir*(boss.phase===3?3:boss.phase===2?2:1);

    if(boss.x<0 || boss.x+boss.w>800) boss.dir*=-1;

    // boss attacks
    if(Date.now()-boss.cooldown>800-boss.phase*200){
      enemies.push({x:boss.x+150,y:120,w:20,h:20,speed:-4});
      boss.cooldown=Date.now();
    }

    // hit boss
    bullets.forEach((b,bi)=>{
      if(hit(b,boss)){
        bullets.splice(bi,1);
        boss.hp--;
        boom(b.x,b.y,"white");
        sound(200);

        if(boss.hp<=0){
          boom(boss.x,boss.y,"purple");
          saveHigh();
          alert("YOU WIN! SCORE: "+score);
          location.reload();
        }
      }
    });
  }
}

// ================= HIGH SCORE =================
function saveHigh(){
  let h=Number(localStorage.getItem("sd_high")||0);
  if(score>h) localStorage.setItem("sd_high",score);
}

// ================= GAME OVER =================
function gameOver(){
  saveHigh();
  alert("Game Over! Score: "+score);
  location.reload();
}

// ================= DRAW =================
function draw(){

  // stars
  ctx.fillStyle="white";
  stars.forEach(s=>{
    s.y+=s.s;
    if(s.y>600)s.y=0;
    ctx.fillRect(s.x,s.y,2,2);
  });

  // player
  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.moveTo(player.x+20,player.y);
  ctx.lineTo(player.x,player.y+40);
  ctx.lineTo(player.x+40,player.y+40);
  ctx.fill();

  // bullets
  ctx.fillStyle="yellow";
  bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  // enemies
  ctx.fillStyle="red";
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));

  // powerups
  powerups.forEach(p=>{
    ctx.fillStyle=p.type==="rapid"?"lime":"blue";
    ctx.fillRect(p.x,p.y,p.w,p.h);
  });

  // particles
  particles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,3,3);
  });

  // boss
  if(boss){
    ctx.fillStyle="purple";
    ctx.fillRect(boss.x,boss.y,boss.w,boss.h);

    ctx.fillStyle="white";
    ctx.fillText("BOSS PHASE "+boss.phase,10,20);

    ctx.strokeRect(500,20,200,15);
    ctx.fillStyle="lime";
    ctx.fillRect(500,20,(boss.hp/boss.maxHp)*200,15);
  }

  // UI
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,10,40);
  ctx.fillText("Lives: "+lives,10,60);
  ctx.fillText("Shield: "+shield,10,80);
  ctx.fillText("Reach 300 for Boss",10,100);

  let h=Number(localStorage.getItem("sd_high")||0);
  ctx.fillText("High Score: "+h,10,120);
}

// ================= LOOP =================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
